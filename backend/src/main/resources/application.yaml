# Configuração da Matriz (DA30).
# Os valores vêm de variáveis de ambiente ou do ficheiro .env da raiz (ver .env.example).
# Nunca escrever credenciais reais neste ficheiro (IA01).
spring:
  application:
    name: matriz
  autoconfigure:
    # A entrada é feita pelo módulo Acesso (DA04). Sem isto, o Spring Boot criava um utilizador em
    # memória e escrevia a sua palavra-passe nos logs (F14).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    # sslmode: prefer (o valor por omissão do driver) usa TLS se o servidor o tiver; no ambiente
    # publicado, o Neon exige TLS: MATRIZ_DB_SSLMODE=require (DA40).
    url: jdbc:postgresql://${MATRIZ_DB_HOST:localhost}:${MATRIZ_DB_PORT:5432}/${MATRIZ_DB_NAME:matriz}?sslmode=${MATRIZ_DB_SSLMODE:prefer}
    username: ${MATRIZ_DB_USER:matriz}
    password: ${MATRIZ_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é do Liquibase (DA30). O Hibernate só confirma que as entidades batem certo.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Sem contexto definido, o Liquibase corria também os dados de demonstração.
    contexts: default
  mvc:
    problemdetails:
      enabled: true

server:
  # Atrás do proxy do ambiente publicado (DA40), o endereço de quem faz o pedido e o HTTPS vêm dos
  # cabeçalhos X-Forwarded-* (F13). Em desenvolvimento fica desligado: MATRIZ_FORWARD_HEADERS=native.
  forward-headers-strategy: ${MATRIZ_FORWARD_HEADERS:none}
  servlet:
    session:
      # A sessão termina após 30 minutos sem pedidos (DA26).
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # Só por HTTPS no ambiente publicado (F6): MATRIZ_COOKIE_SECURE=true.
        secure: ${MATRIZ_COOKIE_SECURE:false}

# Saúde da aplicação para o Docker, a pipeline e o alojamento (DA38). Só /actuator/health,
# com liveness e readiness (a readiness inclui a base de dados), sem pormenores dos componentes.
management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db

matriz:
  # Fuso horário fixo da organização (DA24).
  time-zone: Europe/Lisbon
  # Primeira conta de Administrador, criada no arranque se ainda não existir nenhuma (DA25).
  first-administrator:
    name: ${MATRIZ_ADMIN_NAME:Administrador}
    email: ${MATRIZ_ADMIN_EMAIL:}
    password: ${MATRIZ_ADMIN_PASSWORD:}
