<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:{{ dir }};align-items:{{ align }};gap:8px;min-width:0;"><label for="{{ id }}" style="font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#52525b;white-space:nowrap;">{{ label }}</label><input id="{{ id }}" type="search" defaultValue="{{ value }}" placeholder="{{ placeholder }}" style="box-sizing:border-box;width:{{ w }};max-width:100%;min-height:40px;padding:6px 12px;border:1px solid #a1a1aa;border-radius:6px;background:#fff;color:#1c1a17;font:inherit;font-size:14px;"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:80},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Pesquisar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nome do projeto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;id&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;pesquisa&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, m = p.layout === 'mobile';
    return { id: p.id ?? 'pesquisa', label: p.label ?? 'Pesquisar', value: p.value ?? '', placeholder: p.placeholder ?? 'Nome do projeto', dir: m ? 'column' : 'row', align: m ? 'stretch' : 'center', w: m ? '100%' : '260px' };
  }
}
</script>
</body>
</html>
