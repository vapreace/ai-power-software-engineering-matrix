<head>

<body>
<x-dc>
<div role="status" aria-live="polite" aria-busy="true" style="display:flex;flex-direction:column;gap:16px;padding:24px;background:#fff;border:1px solid #e4e4e7;border-radius:8px;"><p style="margin:0;color:#3f3f46;">{{ text }}</p><div aria-hidden="true" style="display:flex;flex-direction:column;gap:12px;"><div style="height:12px;width:100%;border-radius:6px;background:#efeff1;"></div><div style="height:12px;width:80%;border-radius:6px;background:#efeff1;"></div><div style="height:12px;width:60%;border-radius:6px;background:#efeff1;"></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:140},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A carregar projetos...&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { text: this.props.text ?? 'A carregar projetos...' }; }
}
</script>
</body>
</html>
