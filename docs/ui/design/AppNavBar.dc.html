<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}"><header style="display:flex;align-items:center;gap:40px;height:64px;padding:0 max(32px, calc((100% - 1200px) / 2));background:#fff;border-bottom:1px solid #e4e4e7;box-sizing:border-box;"><span style="font-weight:600;font-size:17px;letter-spacing:0.01em;border:1.5px solid #1c1a17;padding:2px 9px;line-height:1.25;">Matriz</span><nav aria-label="Menu principal" style="display:flex;gap:28px;align-self:stretch;"><sc-for list="{{ items }}" as="it" hint-placeholder-count="4"><sc-if value="{{ it.on }}"><a href="#" aria-current="page" style="display:flex;align-items:center;color:#1c1a17;font-weight:600;text-decoration:none;white-space:nowrap;box-shadow:inset 0 -2px 0 #f5a000;">{{ it.t }}</a></sc-if><sc-if value="{{ it.off }}"><a href="#" style="display:flex;align-items:center;color:#6b655d;text-decoration:none;white-space:nowrap;" style-hover="color:#1c1a17;">{{ it.t }}</a></sc-if></sc-for></nav><div style="margin-left:auto;display:flex;align-items:center;gap:20px;"><span style="white-space:nowrap;font-size:14px;">{{ who }}</span><button type="button" style="display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border:1px solid #cfc9c0;border-radius:2px;background:#fff;color:#1c1a17;font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;" style-hover="border-color:#1c1a17;">Sair</button></div></header></sc-if><sc-if value="{{ isMobile }}"><header style="background:#fff;border-bottom:1px solid #e7e3dd;"><div style="display:flex;align-items:center;gap:12px;min-height:60px;padding:0 16px;"><span style="font-weight:600;font-size:17px;border:1.5px solid #1c1a17;padding:2px 9px;line-height:1.25;">Matriz</span><span style="margin-left:auto;font-size:14px;white-space:nowrap;">{{ who }}</span><button type="button" aria-expanded="{{ openStr }}" aria-controls="menu-principal" onClick="{{ toggle }}" style="min-height:44px;padding:0 14px;border:1px solid #cfc9c0;border-radius:2px;background:#fff;color:#1c1a17;font:inherit;font-weight:500;cursor:pointer;">Menu</button></div><sc-if value="{{ open }}"><nav id="menu-principal" aria-label="Menu principal" style="display:flex;flex-direction:column;padding:4px 16px 16px;"><sc-for list="{{ items }}" as="it" hint-placeholder-count="4"><sc-if value="{{ it.on }}"><a href="#" aria-current="page" style="display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid #e7e3dd;color:#1c1a17;font-weight:600;text-decoration:none;"><span aria-hidden="true" style="width:8px;height:8px;background:#f5a000;"></span>{{ it.t }}</a></sc-if><sc-if value="{{ it.off }}"><a href="#" style="display:flex;align-items:center;min-height:48px;padding-left:18px;border-bottom:1px solid #e7e3dd;color:#3d3832;text-decoration:none;white-space:nowrap;">{{ it.t }}</a></sc-if></sc-for><button type="button" style="margin-top:16px;min-height:44px;border:1px solid #cfc9c0;border-radius:2px;background:#fff;color:#1c1a17;font:inherit;font-weight:500;cursor:pointer;">Sair</button></nav></sc-if></header></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:80},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rui&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ADMINISTRATOR&quot;,&quot;MANAGER&quot;,&quot;MEMBER&quot;,&quot;OBSERVER&quot;],&quot;default&quot;:&quot;MANAGER&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;projects&quot;,&quot;my-tasks&quot;,&quot;teams&quot;,&quot;accounts&quot;],&quot;default&quot;:&quot;projects&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;menuOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: null };
  renderVals() {
    const p = this.props, role = p.role ?? 'MANAGER';
    const R = { ADMINISTRATOR: 'Administrador', MANAGER: 'Gestor', MEMBER: 'Membro', OBSERVER: 'Observador' };
    const all = [
      { k: 'home', t: 'Painel' }, { k: 'projects', t: 'Projetos' },
      { k: 'my-tasks', t: 'As minhas tarefas', r: ['MANAGER', 'MEMBER'] },
      { k: 'teams', t: 'Equipas' }, { k: 'accounts', t: 'Contas', r: ['ADMINISTRATOR'] }
    ];
    const active = p.active ?? 'projects';
    const items = all.filter(i => !i.r || i.r.includes(role)).map(i => ({ t: i.t, on: i.k === active, off: i.k !== active }));
    const open = this.state.open ?? !!p.menuOpen, mobile = p.layout === 'mobile';
    return { items, who: `${p.userName ?? 'Rui'} (${R[role]})`, isDesktop: !mobile, isMobile: mobile, open, openStr: open ? 'true' : 'false', toggle: () => this.setState({ open: !open }) };
  }
}
</script>
</body>
</html>
