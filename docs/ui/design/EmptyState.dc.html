<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="status" style="display:flex;flex-direction:column;gap:6px;padding:40px 24px;background:#fff;border:1px solid #e4e4e7;border-radius:8px;text-align:center;align-items:center;"><p style="margin:0;font-weight:600;font-size:18px;">{{ title }}</p><sc-if value="{{ hasDetail }}"><p style="margin:0;color:#6b655d;text-wrap:pretty;">{{ detail }}</p></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:140},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Não há projetos para mostrar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;detail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { title: this.props.title ?? 'Não há projetos para mostrar', detail: this.props.detail, hasDetail: !!this.props.detail }; }
}
</script>
</body>
</html>
