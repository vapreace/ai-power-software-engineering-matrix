<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="dialog" aria-modal="true" aria-labelledby="{{ tId }}" aria-describedby="{{ mId }}" style="box-sizing:border-box;width:100%;max-width:480px;background:#fff;border:1px solid #e4e4e7;border-radius:8px;box-shadow:0 16px 40px rgba(24,24,27,0.18);overflow:hidden;"><div style="padding:24px;display:flex;flex-direction:column;gap:8px;"><h2 id="{{ tId }}" style="margin:0;font-size:20px;font-weight:600;line-height:1.3;">{{ title }}</h2><p id="{{ mId }}" style="margin:0;color:#3f3f46;text-wrap:pretty;">{{ message }}</p></div><div style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid #e4e4e7;background:#fafafa;"><button type="button" style="min-width:112px;min-height:44px;padding:0 18px;border:1px solid #d4d4d8;border-radius:6px;background:#fff;color:#1c1a17;font:inherit;font-weight:500;cursor:pointer;outline:2px solid #9a5200;outline-offset:2px;">Cancelar</button><sc-if value="{{ danger }}" hint-placeholder-val="{{ true }}"><button type="button" style="min-width:112px;min-height:44px;padding:0 18px;border:1px solid #b3261e;border-radius:6px;background:#b3261e;color:#fff;font:inherit;font-weight:600;cursor:pointer;" style-hover="background:#911f18;">{{ confirmLabel }}</button></sc-if><sc-if value="{{ primary }}"><button type="button" style="min-width:112px;min-height:44px;padding:0 18px;border:1px solid #f5a000;border-radius:6px;background:#f5a000;color:#1c1a17;font:inherit;font-weight:600;cursor:pointer;" style-hover="background:#e08f00;">{{ confirmLabel }}</button></sc-if></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:240},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Eliminar projeto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;message&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Eliminar o projeto «Novo armazém» e as suas 10 tarefas? Esta ação não pode ser desfeita.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;confirmLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Confirmar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;danger&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;id&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;confirmar&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, id = p.id ?? 'confirmar', d = p.danger ?? true;
    return { tId: id + '-titulo', mId: id + '-texto', title: p.title ?? 'Eliminar projeto', message: p.message ?? 'Eliminar o projeto «Novo armazém» e as suas 10 tarefas? Esta ação não pode ser desfeita.', confirmLabel: p.confirmLabel ?? 'Confirmar', danger: !!d, primary: !d };
  }
}
</script>
</body>
</html>
