<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<form novalidate="" style="display:flex;flex-direction:column;gap:12px;padding-top:16px;"><dc-import name="FormField" id="{{ fid }}" label="Novo comentário" kind="textarea" rows="3" value="{{ value }}" error="{{ error }}" hint="Até 2000 caracteres." hint-size="100%,150px"></dc-import><div style="display:flex;justify-content:flex-end;"><sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><button type="submit" style="min-height:44px;padding:0 20px;border:1px solid #f5a000;border-radius:6px;background:#f5a000;color:#1c1a17;font:inherit;font-weight:600;cursor:pointer;" style-hover="background:#e08f00;">Comentar</button></sc-if><sc-if value="{{ submitting }}"><button type="submit" disabled="" aria-disabled="true" style="display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border:1px solid #f5a000;border-radius:6px;background:#f5a000;color:#1c1a17;font:inherit;font-weight:600;opacity:0.6;cursor:progress;"><span aria-hidden="true" style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(28,26,23,0.3);border-top-color:#1c1a17;box-sizing:border-box;"></span>A enviar...</button></sc-if></div></form>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:230},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;submitting&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;id&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;comentario&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = !!this.props.submitting;
    return { fid: this.props.id ?? 'comentario', value: this.props.value ?? '', error: this.props.error || undefined, idle: !s, submitting: s };
  }
}
</script>
</body>
</html>
