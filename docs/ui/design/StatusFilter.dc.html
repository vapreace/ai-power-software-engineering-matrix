<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<fieldset style="margin:0;padding:0;border:0;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:0 18px;"><legend style="float:left;padding:0;margin-right:2px;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#6b655d;line-height:44px;">{{ legend }}</legend><sc-for list="{{ opts }}" as="o" hint-placeholder-count="3"><label style="display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;white-space:nowrap;"><input type="checkbox" defaultChecked="{{ o.checked }}" style="width:16px;height:16px;margin:0;accent-color:#1c1a17;cursor:pointer;">{{ o.label }}</label></sc-for></fieldset>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:60},&quot;legend&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Estado&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string,checked:boolean}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      legend: this.props.legend ?? 'Estado',
      opts: this.props.options ?? [{ label: 'Ativo', checked: true }, { label: 'Concluído', checked: true }, { label: 'Arquivado', checked: false }]
    };
  }
}
</script>
</body>
</html>
