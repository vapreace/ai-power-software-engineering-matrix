<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ none }}"><p style="margin:0;color:#52525b;">Ainda não há comentários.</p></sc-if><sc-if value="{{ some }}" hint-placeholder-val="{{ true }}"><ol role="list" style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;"><sc-for list="{{ rows }}" as="c" hint-placeholder-count="2"><li style="padding:16px 0;border-bottom:1px solid #e4e4e7;display:flex;flex-direction:column;gap:6px;"><div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;"><span style="font-weight:600;">{{ c.author }}</span><time dateTime="{{ c.iso }}" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;color:#52525b;white-space:nowrap;">{{ c.when }}</time></div><p style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere;">{{ c.content }}</p></li></sc-for></ol></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:200},&quot;comments&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{author:string,when:string,iso:string,content:string}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const rows = this.props.comments ?? [
      { author: 'Rui', when: '09/11/2026 16:30', iso: '2026-11-09T16:30', content: 'Preciso disto até sexta.' },
      { author: 'Marta', when: '10/11/2026 14:30', iso: '2026-11-10T14:30', content: 'Já pedi dois orçamentos.' }
    ];
    return { rows, none: !rows.length, some: rows.length > 0 };
  }
}
</script>
</body>
</html>
