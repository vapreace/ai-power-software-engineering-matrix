<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ cards }}" hint-placeholder-val="{{ true }}"><dl aria-label="{{ label }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px;margin:0;"><sc-for list="{{ items }}" as="i" hint-placeholder-count="3"><div style="background:#fff;border:1px solid #e4e4e7;border-radius:8px;padding:20px 24px;display:flex;flex-direction:column;gap:8px;"><dt style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#52525b;">{{ i.t }}</dt><dd style="margin:0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:44px;font-weight:500;line-height:1;letter-spacing:-0.02em;">{{ i.n }}</dd></div></sc-for></dl></sc-if><sc-if value="{{ inline }}"><dl aria-label="{{ label }}" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;border:1px solid #e4e4e7;border-radius:6px;"><sc-for list="{{ items }}" as="i" hint-placeholder-count="3"><div style="padding:8px 10px;display:flex;flex-direction:column;gap:2px;border-left:{{ i.bl }};"><dt style="font-size:12px;color:#52525b;white-space:nowrap;">{{ i.t }}</dt><dd style="margin:0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:18px;font-weight:500;line-height:1.2;">{{ i.n }}</dd></div></sc-for></dl></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:120},&quot;todo&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;inProgress&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;done&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cards&quot;,&quot;inline&quot;],&quot;default&quot;:&quot;cards&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tarefas por estado&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, inl = p.variant === 'inline';
    const items = [['Por fazer', p.todo ?? 2], ['Em curso', p.inProgress ?? 2], ['Concluída', p.done ?? 6]].map(([t, n], i) => ({ t, n, bl: i ? '1px solid #e4e4e7' : '0' }));
    return { items, cards: !inl, inline: inl, label: p.label ?? 'Tarefas por estado' };
  }
}
</script>
</body>
</html>
